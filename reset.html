<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Chochetitos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header></header> <main class="container page">
    <section class="auth">
        <h1>Nueva Contraseña</h1>
        <p>Por favor, ingresa tu nueva contraseña.</p>

        <form class="auth-form" id="reset-form">
            <div class="form-group">
                <label for="password">Nueva Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
            </div>

            <div class="form-group">
                <label for="password2">Confirmar Contraseña</label>
                <input type="password" id="password2" placeholder="Repite la contraseña" required>
            </div>

            <button type="submit" class="btn-primary">Cambiar Contraseña</button>
            <p id="reset-message" class="auth-message"></p>
        </form>
    </section>
</main>

<footer></footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/componentes.js"></script>
<script src="js/reset.js"></script> <script src="js/accesibilidad.js"></script>

</body>
</html>
