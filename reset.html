<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña - Chochetitos</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header></header>

<main class="container page">
  <section class="auth">
    <h1>Restablecer contraseña</h1>
    <p>Escribe tu nueva contraseña. Procura que sea segura.</p>

    <form class="auth-form" id="reset-form">
      <div class="form-group">
        <label for="password">Nueva contraseña</label>
        <input type="password" id="password" placeholder="********" required>
      </div>

      <div class="form-group">
        <label for="password2">Repetir contraseña</label>
        <input type="password" id="password2" placeholder="********" required>
      </div>

      <button type="submit" class="btn-primary">Guardar nueva contraseña</button>

      <p id="reset-message" class="auth-message"></p>
    </form>
  </section>
</main>

<footer></footer>

<script src="js/componentes.js"></script>
<script src="js/reset.js"></script>
<script src="js/accesibilidad.js"></script>
</body>
</html>
