<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Chochetitos</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- HEADER -->
    <header></header>

    <main class="container page">
        <section class="contact">
            <h1>Contáctanos</h1>
            <p>
                ¿Quieres un pedido personalizado, cotizar amigurumis para un evento o tienes alguna duda? 
                Escríbenos y te responderemos lo antes posible.
            </p>

            <div class="contact-grid">
                <form class="contact-form">
                    <div class="form-group">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" placeholder="Escribe tu nombre" required>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" placeholder="tucorreo@ejemplo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="asunto">Asunto</label>
                        <input type="text" id="asunto" placeholder="Ej. Pedido personalizado de amigurumi">
                    </div>

                    <div class="form-group">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" rows="5" placeholder="Cuéntanos qué te gustaría decirnos" required></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Enviar mensaje</button>
                </form>

                <div class="contact-info">
                    <h3>Información</h3>
                    <p><i class="fa-solid fa-envelope"></i> chochetitos31@gmail.com</p>
                    <p><i class="fa-solid fa-phone"></i> +52 449 386 1584</p>
                    <p><i class="fa-solid fa-location-dot"></i> Aguascalientes, MX</p>

                    <h3>Horarios</h3>
                    <p>Lunes a Viernes: 9:00 - 19:00 hrs</p>
                    <p>Sábado: 10:00 - 15:00 hrs</p>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/componentes.js"></script>
    <script src="js/accesibilidad.js"></script>
    <script src="js/contacto.js"></script>

</body>
</html>
