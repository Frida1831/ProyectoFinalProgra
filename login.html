<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Chochetitos</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header></header>

<main class="container page">
    <section class="auth">
        <h1>Inicia sesión</h1>
        <p>Accede para agregar productos al carrito y completar tus compras.</p>

        <form class="auth-form" id="login-form">
            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="tucorreo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="********" required>
            </div>

            <div class="form-group captcha-box">
                <label>Código de verificación</label>
                <div class="captcha">
                    <span id="captcha-text">A7K9P</span>
                    <button type="button" id="refresh-captcha">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>
                <input type="text" id="captcha-input" placeholder="Ingresa el código" required>
            </div>

            <button type="submit" class="btn-primary">Entrar</button>

            <p class="auth-links">
                <a href="recuperar.html">¿Olvidaste tu contraseña?</a><br>
                <a href="register.html">Crear una cuenta</a>
            </p>

            <p id="auth-message" class="auth-message"></p>
        </form>
    </section>
</main>

<footer></footer>

<script src="js/componentes.js"></script>
<script src="js/login.js"></script>

</body>
</html>
