<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Chochetitos</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header></header>

<main class="container page">
    <section class="admin">

        <h1>Panel de Administración</h1>
        <p>Gestiona los productos de la tienda 🧶</p>

        <!-- FORMULARIO PARA AGREGAR PRODUCTOS -->
        <div class="admin-form">
            <h3>Agregar producto</h3>

            <form id="product-form">
                <div class="form-group">
                    <label>Nombre del producto</label>
                    <input type="text" id="nombre" placeholder="Ej. Conejita Pastel" required>
                </div>

                <div class="form-group">
                    <label>Precio</label>
                    <input type="number" id="precio" placeholder="320" required>
                </div>

                <div class="form-group">
                    <label>Categoría</label>
                    <select id="categoria" required>
                        <option value="">Selecciona...</option>
                        <option value="amigurumis">Amigurumis</option>
                        <option value="accesorios">Accesorios</option>
                        <option value="decoracion">Decoración</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>URL de la imagen</label>
                    <input type="text" id="img" placeholder="img/conejita.jpg" required>
                </div>

                <button type="submit" class="btn-primary">Agregar producto</button>
            </form>
        </div>

        <!-- TABLA DE PRODUCTOS -->
        <div class="admin-table">
            <h3>Listado de productos</h3>

            <table>
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="product-list"></tbody>
            </table>
        </div>

    </section>
</main>

<footer></footer>

<script src="js/componentes.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
