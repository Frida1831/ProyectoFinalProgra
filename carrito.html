<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Chochetitos</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header></header>

<main class="container page">
    <section class="cart">
        <h1>Tu carrito</h1>
        <p>Aquí puedes revisar tus productos antes de realizar tu compra.</p>

        <div id="cart-items" class="cart-items">
            <p class="empty-cart">Tu carrito está vacío 🛒</p>
        </div>

        <div class="cart-summary">
            <h3>Resumen de compra</h3>
            <p>Subtotal: <span id="subtotal">$0.00</span></p>
            <p>Envío: <span>$40.00</span></p>
            <p class="total">Total: <span id="total">$40.00</span></p>

            <button class="btn-primary" id="checkout-btn">Proceder al pago</button>
        </div>
    </section>
</main>

<footer></footer>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/suscripcion.js"></script>
<script src="js/componentes.js"></script>
<script src="js/index.js"></script>
<script src="js/busqueda.js"></script>
<script src="js/accesibilidad.js"></script>
<script src="js/favoritos.js"></script>


<script src="js/carrito.js"></script>

</body>
</html>
