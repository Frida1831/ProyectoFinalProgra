<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Chochetitos</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header></header>

<main class="container page">
    <section class="auth">
        <h1>Crear cuenta</h1>
        <p>Regístrate para poder comprar, guardar favoritos y llevar tu carrito.</p>

        <form class="auth-form" id="register-form">

            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Ej. Daniela García" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="tucorreo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="********" required>
            </div>

            <div class="form-group">
                <label for="password2">Repetir contraseña</label>
                <input type="password" id="password2" placeholder="********" required>
            </div>

            <button type="submit" class="btn-primary">Crear cuenta</button>

            <p class="auth-links">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>.
            </p>

            <p id="register-message" class="auth-message"></p>
        </form>
    </section>
</main>

<footer></footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/componentes.js"></script>
<script src="js/register.js"></script>
<script src="js/accesibilidad.js"></script>

</body>
</html>
